
<!DOCTYPE html>
<html>
<head>
    <title>ApplyIQ Integration Test</title>
</head>
<body>
    <h1>Python Backend Intern Application</h1>

    <form id="application-form">
        <label for="full-name">Full Name</label>
        <input
            id="full-name"
            name="full_name"
            type="text"
            required
        >

        <label for="email">Email</label>
        <input
            id="email"
            name="email"
            type="email"
            required
        >

        <label for="resume">Resume</label>
        <input
            id="resume"
            name="resume"
            type="file"
            required
        >

        <label for="cover-letter">Cover Letter</label>
        <textarea
            id="cover-letter"
            name="cover_letter"
        ></textarea>

        <button
            id="submit-button"
            type="button"
        >
            Submit Application
        </button>
    </form>
</body>
</html>
