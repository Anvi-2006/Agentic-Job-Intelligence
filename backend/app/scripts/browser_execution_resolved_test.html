<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resolved Application Form</title>
</head>
<body>
    <h1>Python Backend Intern Application</h1>

    <form id="application-form">
        <label>
            Full name
            <input
                id="full_name"
                name="full_name"
                type="text"
                required
            >
        </label>

        <br><br>

        <label>
            Email
            <input
                id="email"
                name="email"
                type="email"
                required
            >
        </label>

        <br><br>

        <label>
            Resume
            <input
                id="resume"
                name="resume"
                type="file"
                required
            >
        </label>

        <br><br>

        <label>
            Cover letter
            <textarea
                id="cover_letter"
                name="cover_letter"
                required
            ></textarea>
        </label>

        <br><br>

        <button type="submit">
            Submit Application
        </button>
    </form>
</body>
</html>
