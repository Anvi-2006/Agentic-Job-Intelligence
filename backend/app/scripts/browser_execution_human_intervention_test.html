<!DOCTYPE html>
<html>
<head>
    <title>ApplyIQ Human Intervention Test</title>
</head>
<body>
    <h1>Job Application</h1>

    <form>
        <label>
            Full Name
            <input
                id="full_name"
                name="full_name"
                type="text"
                required
            >
        </label>

        <label>
            Email
            <input
                id="email"
                name="email"
                type="email"
                required
            >
        </label>

        <label>
            Resume
            <input
                id="resume"
                name="resume"
                type="file"
                required
            >
        </label>

        <label>
            Cover Letter
            <textarea
                id="cover_letter"
                name="cover_letter"
                required
            ></textarea>
        </label>

        <label>
            Why should we hire you?
            <input
                id="unknown_required_field"
                name="unknown_required_field"
                type="text"
                required
            >
        </label>
    </form>
</body>
</html>
